<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Decode TOTP QR codes and extract authentication secrets. Free online tool for scanning and decoding two-factor authentication QR codes."
        />
        <meta
            name="keywords"
            content="TOTP, QR code, decoder, 2FA, two-factor authentication, authenticator, scanner"
        />
        <meta name="author" content="TOTP Decoder" />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://totp.onlyyaml.dev/" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://totp.onlyyaml.dev/" />
        <meta
            property="og:title"
            content="TOTP QR Decoder - Free Online Tool"
        />
        <meta
            property="og:description"
            content="Decode TOTP QR codes and extract authentication secrets. Free online tool for scanning and decoding two-factor authentication QR codes."
        />
        <meta
            property="og:image"
            content="https://totp.onlyyaml.dev/logo512.png"
        />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:url" content="https://totp.onlyyaml.dev/" />
        <meta
            name="twitter:title"
            content="TOTP QR Decoder - Free Online Tool"
        />
        <meta
            name="twitter:description"
            content="Decode TOTP QR codes and extract authentication secrets. Free online tool for scanning and decoding two-factor authentication QR codes."
        />
        <meta
            name="twitter:image"
            content="https://totp.onlyyaml.dev/logo512.png"
        />

        <!-- Favicon and PWA -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link
            rel="icon"
            type="image/png"
            sizes="96x96"
            href="/favicon-96x96.png"
        />
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <link rel="manifest" href="/manifest.json" />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: light)"
            content="#FAFAF9"
        />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: dark)"
            content="#0A0A0B"
        />

        <title>TOTP QR Decoder</title>
        <script>
            // Detect browser language and set html lang attribute
            const userLang = navigator.language || navigator.userLanguage;
            const supportedLangs = ["en", "ru"];
            const detectedLang = userLang.substring(0, 2);
            const lang = supportedLangs.includes(detectedLang)
                ? detectedLang
                : "en";
            document.documentElement.lang = lang;

            // Update title based on language
            if (lang === "ru") {
                document.title = "TOTP QR Декодер";
            }

            // Dark theme detection and setup
            if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                document.documentElement.classList.add("dark");
            }

            // Set RTL direction for RTL languages
            const rtlLanguages = ["ar", "he", "fa", "ur"];
            if (rtlLanguages.includes(lang)) {
                document.documentElement.dir = "rtl";
            }
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
